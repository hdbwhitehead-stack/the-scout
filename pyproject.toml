[project]
name = "polymarket-scout"
version = "0.1.0"
description = "Find high-probability/low-payoff Polymarket opportunities"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "typer>=0.12",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.scripts]
scout = "scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
